# Spec vs implementation: run check-endpoints.py against the latest Lichess API spec,
# and create or update a single issue with a checklist of missing endpoints/params.
# See also: issue #6 (historical umbrella), Jira CHESS-xxx Rolling CI.

# When enabling schedule: uncomment the schedule block below.
# Duration: weekly. Cron "0 3 * * 1" = Monday 03:00 UTC (avoids overlap with 02:00 cassette refresh if present).
# GitHub does not support variables in cron; change the cron string if you want a different interval (e.g. "0 3 * * 1" weekly, "0 3 1 * *" monthly).
name: Check endpoints (spec vs implementation)

on:
  workflow_dispatch: {}
  push:
    branches: ["check-endpoints-testing"]
    paths:
      - ".github/workflows/check-endpoints.yml"
      - "check-endpoints.py"
  # Weekly run — uncomment to enable:
  # schedule:
  #   - cron: "0 3 * * 1"

jobs:
  check-endpoints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Fetch API spec
        run: |
          mkdir -p spec
          curl -fsSL -o spec/openapi.yaml "https://lichess.org/api/openapi.yaml"

      - name: Run check-endpoints
        id: check
        run: |
          python check-endpoints.py --json spec/openapi.yaml > output.json 2>stderr.txt
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail on script error (exit 2)
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "check-endpoints.py failed (e.g. spec not found). stderr:"
          cat stderr.txt
          exit 1

      - name: Build issue body and create or update issue (missing endpoints)
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(python3 - << 'PY'
          import json
          import sys
          with open("output.json") as f:
              data = json.load(f)
          intro = """This issue is automatically updated by the [check-endpoints](.github/workflows/check-endpoints.yml) workflow. Manual edits to the list below will be overwritten. For historical context and implementation notes, see issue 6.

          *Note: The text above and the checklist below are for testing only (e.g. when this workflow runs on a fork).*

          """
          parts = [intro]
          if data.get("missing_endpoints"):
              parts.append("## Missing endpoints (path, operation)\n\n")
              for e in data["missing_endpoints"]:
                  path, op = e["path"], e["operation"]
                  parts.append(f"- [ ] `{op}` `{path}`\n")
              parts.append("\n")
          if data.get("missing_params"):
              parts.append("## Missing query params (implemented endpoints)\n\n")
              for p in data["missing_params"]:
                  path, op = p["path"], p["operation"]
                  params = ", ".join(f"`{x}`" for x in p["params"])
                  method = p.get("method", "")
                  parts.append(f"- [ ] `{op}` `{path}` — missing: {params} — {method}\n")
          sys.stdout.write("".join(parts))
          PY
          )
          echo "$BODY" > body.md
          # Find open issue with our title
          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --state open --limit 1 --json number --jq '.[0].number' --search 'in:title "Spec vs implementation: missing endpoints (auto-updated)"' 2>/dev/null || true)
          if [ -n "$ISSUE_NUM" ]; then
            gh issue edit "$ISSUE_NUM" --body-file body.md
            echo "Updated issue #$ISSUE_NUM"
          else
            # Reopen if closed: find any issue with that title
            OLD_NUM=$(gh issue list --repo "${{ github.repository }}" --state all --limit 1 --json number --jq '.[0].number' --search 'in:title "Spec vs implementation: missing endpoints (auto-updated)"' 2>/dev/null || true)
            if [ -n "$OLD_NUM" ]; then
              gh issue reopen "$OLD_NUM"
              gh issue edit "$OLD_NUM" --body-file body.md
              echo "Reopened and updated issue #$OLD_NUM"
            else
              gh issue create --title "Spec vs implementation: missing endpoints (auto-updated)" --body-file body.md
              echo "Created new issue"
            fi
          fi

      - name: Close issue if no missing endpoints
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --state open --limit 1 --json number --jq '.[0].number' --search 'in:title "Spec vs implementation: missing endpoints (auto-updated)"' 2>/dev/null || true)
          if [ -n "$ISSUE_NUM" ]; then
            gh issue close "$ISSUE_NUM" --comment "No missing endpoints or params as of this run. This issue will be reopened when the spec gains new endpoints we don't implement."
            echo "Closed issue #$ISSUE_NUM"
          fi
